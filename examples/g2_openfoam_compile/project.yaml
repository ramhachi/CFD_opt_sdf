schema_version: 2
problem_id: g2_openfoam_multipoint
units:
  length: m
  time: s
  mass: kg
coordinate_frame:
  id: global_frame
  origin_m: [0.0, 0.0, 0.0]
  basis:
    x: [1.0, 0.0, 0.0]
    y: [0.0, 1.0, 0.0]
    z: [0.0, 0.0, 1.0]
grid:
  kind: uniform_cartesian
  voxel_size_m: 0.02
  padding_m: 0.15
  domain_bounds_m:
    lower: [-1.0, -1.2, -0.6]
    upper: [2.0, 1.2, 0.7]
reference_values:
  area_m2: 1.2
  length_m: 0.8
  moment_center_m: [0.25, 0.0, 0.0]
geometry_regions:
  # The front-wing geometry directory is the authoritative asset source.
  # Tire solids remain outside the fixed-solid mask; their clearance envelope
  # may cover fixed vehicle or mount solids, which take precedence in masks.
  - {id: vehicle_nose, role: fixed_solid, file: ../front_wing/geometry/vehicle_nose.stl}
  - {id: ground, role: fixed_solid, file: ../front_wing/geometry/ground.stl}
  - {id: front_wing_initial, role: initial_design, file: ../front_wing/geometry/front_wing_initial.stl}
  - {id: allowed_front_box, role: design_domain, file: ../front_wing/geometry/allowed_front_box.stl}
  - {id: tire_clearance, role: forbidden_region, file: ../front_wing/geometry/forbidden_tire_clearance.stl}
  - {id: root_mount_left_fixed, role: fixed_solid, file: ../front_wing/geometry/root_mount_left.stl}
  - {id: root_mount_right_fixed, role: fixed_solid, file: ../front_wing/geometry/root_mount_right.stl}
  - {id: root_mount_left, role: root, file: ../front_wing/geometry/root_mount_left.stl}
  - {id: root_mount_right, role: root, file: ../front_wing/geometry/root_mount_right.stl}
flow_cases:
  - id: straight
    freestream_velocity_mps: [30.0, 0.0, 0.0]
    fluid:
      model: incompressible_newtonian
      density_kg_m3: 1.225
      dynamic_viscosity_pa_s: 1.8e-5
    turbulence:
      model: k_omega_sst
      turbulence_intensity: 0.05
      turbulence_length_scale_m: 0.2
    boundary_conditions:
      inlet: freestream
      outlet: pressure_outlet
      spanMin: symmetry
      spanMax: symmetry
      lower: moving_wall
      upper: symmetry
    motion_profiles:
      moving_lower:
        kind: translation
        boundary_ids: [lower]
        velocity_mps: [30.0, 0.0, 0.0]
  - id: yawed
    freestream_velocity_mps: [29.5, 5.2, 0.0]
    fluid:
      model: incompressible_newtonian
      density_kg_m3: 1.225
      dynamic_viscosity_pa_s: 1.8e-5
    turbulence:
      model: k_omega_sst
      turbulence_intensity: 0.05
      turbulence_length_scale_m: 0.2
    boundary_conditions:
      inlet: freestream
      outlet: pressure_outlet
      spanMin: symmetry
      spanMax: symmetry
      lower: moving_wall
      upper: symmetry
    motion_profiles:
      moving_lower:
        kind: translation
        boundary_ids: [lower]
        velocity_mps: [29.5, 5.2, 0.0]
responses:
  - id: rotated_force
    kind: force
    flow_case_id: straight
    direction: [0.70710678, 0.70710678, 0.0]
  - id: yaw_side_force
    kind: force
    flow_case_id: yawed
    direction: [0.0, 1.0, 0.0]
objectives:
  - id: multipoint_force
    sense: minimize
    terms:
      - {coefficient: 0.7, flow_case_id: straight, response_id: rotated_force}
      - {coefficient: 0.3, flow_case_id: yawed, response_id: yaw_side_force}
constraints:
  - id: yaw_force_limit
    relation: <=
    limit: 2.0
    terms:
      - {coefficient: 1.0, flow_case_id: yawed, response_id: yaw_side_force}
topology_policy:
  root_groups:
    - {id: mounts, region_ids: [root_mount_left, root_mount_right]}
  solid_connectivity:
    mode: required_root_groups
    required_root_group_ids: [mounts]
    max_components: 2
    evaluate_eroded: true
  void_connectivity:
    mode: disabled
    required_root_group_ids: []
    max_components: null
    evaluate_eroded: false
  minimum_solid_width_m: 0.01
  minimum_void_width_m: 0.012
  minimum_gap_m: 0.008
  erosion_radius_m: 0.004
