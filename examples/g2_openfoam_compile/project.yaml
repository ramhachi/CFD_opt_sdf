schema_version: 2
problem_id: g2_openfoam_multipoint
units:
  length: m
  time: s
  mass: kg
coordinate_frame:
  id: global_frame
  origin_m: [0.0, 0.0, 0.0]
  basis:
    x: [1.0, 0.0, 0.0]
    y: [0.0, 1.0, 0.0]
    z: [0.0, 0.0, 1.0]
grid:
  kind: uniform_cartesian
  voxel_size_m: 0.02
  padding_m: 0.15
  domain_bounds_m:
    lower: [-1.0, -0.8, -0.6]
    upper: [2.0, 0.8, 0.6]
reference_values:
  area_m2: 1.2
  length_m: 0.8
  moment_center_m: [0.25, 0.0, 0.0]
geometry_regions:
  - {id: vehicle, role: fixed_solid, file: geometry/vehicle.stl}
  - {id: initial_surface, role: initial_design, file: geometry/initial_surface.stl}
  - {id: design_domain, role: design_domain, file: geometry/design_domain.stl}
  - {id: keepout, role: forbidden_region, file: geometry/keepout.stl}
  - {id: mount, role: root, file: geometry/mount.stl}
flow_cases:
  - id: straight
    freestream_velocity_mps: [30.0, 0.0, 0.0]
    fluid:
      model: incompressible_newtonian
      density_kg_m3: 1.225
      dynamic_viscosity_pa_s: 1.8e-5
    turbulence:
      model: k_omega_sst
      turbulence_intensity: 0.05
      turbulence_length_scale_m: 0.2
    boundary_conditions:
      inlet: freestream
      outlet: pressure_outlet
      spanMin: symmetry
      spanMax: symmetry
      lower: moving_wall
      upper: symmetry
    motion_profiles:
      moving_lower:
        kind: translation
        boundary_ids: [lower]
        velocity_mps: [30.0, 0.0, 0.0]
  - id: yawed
    freestream_velocity_mps: [29.5, 5.2, 0.0]
    fluid:
      model: incompressible_newtonian
      density_kg_m3: 1.225
      dynamic_viscosity_pa_s: 1.8e-5
    turbulence:
      model: k_omega_sst
      turbulence_intensity: 0.05
      turbulence_length_scale_m: 0.2
    boundary_conditions:
      inlet: freestream
      outlet: pressure_outlet
      spanMin: symmetry
      spanMax: symmetry
      lower: moving_wall
      upper: symmetry
    motion_profiles:
      moving_lower:
        kind: translation
        boundary_ids: [lower]
        velocity_mps: [29.5, 5.2, 0.0]
responses:
  - id: rotated_force
    kind: force
    flow_case_id: straight
    direction: [0.70710678, 0.70710678, 0.0]
  - id: yaw_side_force
    kind: force
    flow_case_id: yawed
    direction: [0.0, 1.0, 0.0]
objectives:
  - id: multipoint_force
    sense: minimize
    terms:
      - {coefficient: 0.7, flow_case_id: straight, response_id: rotated_force}
      - {coefficient: 0.3, flow_case_id: yawed, response_id: yaw_side_force}
constraints:
  - id: yaw_force_limit
    relation: <=
    limit: 2.0
    terms:
      - {coefficient: 1.0, flow_case_id: yawed, response_id: yaw_side_force}
topology_policy:
  root_groups:
    - {id: mounts, region_ids: [mount]}
  solid_connectivity:
    mode: required_root_groups
    required_root_group_ids: [mounts]
    max_components: 2
    evaluate_eroded: true
  void_connectivity:
    mode: disabled
    required_root_group_ids: []
    max_components: null
    evaluate_eroded: false
  minimum_solid_width_m: 0.01
  minimum_void_width_m: 0.012
  minimum_gap_m: 0.008
  erosion_radius_m: 0.004
