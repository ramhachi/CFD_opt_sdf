[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfd-sdf"
version = "0.1.0"
description = "SDF geometry service prototype for front-wing CFD optimization."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "trimesh>=4.4",
  "pyvista>=0.43",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.0",
  "rtree>=1.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
cfd-sdf = "cfd_sdf.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
